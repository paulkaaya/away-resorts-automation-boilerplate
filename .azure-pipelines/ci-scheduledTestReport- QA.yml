##example usage of scheduled pipeline to run Playwright tests and generate report
name: Playwright Test and Report - Weekday Nightly Regression - PPRD

schedules:
  - cron: '00 18 * * 1-5' #runs in UTC at 18:00 (6pm) Monday to Friday
    displayName: 'Weekday Nightly Regression - PPRD'
    branches:
      include:
        - main
    always: true

trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

extends:
  template: ci-templates/playwrightTemplate.yml
  parameters:
    environment: 'pprd'
    runAll: 'false'
    args: ' '
    generateScreenshots: 'false'
    storeArtifacts: 'false'
